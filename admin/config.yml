backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{location}}"
    sortable_fields: ["title", "year", "commit_date"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Commercial", "Residential", "Industrial", "Church", "Assembly"]
      - {label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2100}
      - {label: "Date (shown on site)", name: "date", widget: "string", required: false, hint: "e.g. \"June 2025\". Leave blank to just show the year."}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Software Used", name: "software", widget: "list", required: false}
      - label: "Images"
        name: "images"
        widget: "list"
        hint: "Upload one or more photos. The first image becomes the cover photo shown on the Projects grid."
        field: {label: "Photo", name: "src", widget: "image"}
      - {label: "Video URL (YouTube/Vimeo)", name: "video", widget: "string", required: false}
      - {label: "Case study PDF (optional)", name: "document", widget: "file", required: false, hint: "Upload a PDF of calculations/drawings if you want a download link on this project's page."}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, required: false}
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Client", name: "client", widget: "string"}
      - {label: "Quote", name: "quote", widget: "text", required: false, hint: "You can also just write the quote as the entry body below instead."}
  - name: "settings"
    label: "Settings"
    files:
      - label: "Site Settings"
        name: "site_settings"
        file: "content/settings/site.json"
        fields:
          - {label: "Site Title", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "About Photo", name: "about_photo", widget: "image", required: false}
          - {label: "About Bio", name: "about_bio", widget: "text", required: false}
