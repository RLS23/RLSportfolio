tion value="Residential">Residential</option><option value="Industrial">Industrial</option><option value="Church">Church</option><option value="Assembly">Assembly</option></select></label></div><div class='grid' id='projects-grid'><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div></section></main><footer class="footer"><div class="footer-inner"><nav class="footer-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a><a href="skills.html">Skills</a><a href="testimonials.html">Testimonials</a><a href="contact.html">Contact</a></nav><p class="footer-contact"><a href="mailto:ramelaurenzsalapare@gmail.com" aria-label="Email Rame Laurenz"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg> ramelaurenzsalapare@gmail.com</a> &middot; Philippines</p><p class="meta">&copy; 2025 Rame Laurenz &mdash; Structural Engineer</p></div></footer>
<script>
let allProjects = [];

function renderProjects() {
  const grid = document.getElementById('projects-grid');
  const sortVal = document.getElementById('sort-year').value;
  const typeVal = document.getElementById('filter-type').value;

  let list = typeVal === 'all' ? allProjects.slice() : allProjects.filter(p => p.type === typeVal);

  list.sort((a, b) => sortVal === 'year-asc'
    ? (a.year || 0) - (b.year || 0)
    : (b.year || 0) - (a.year || 0));

  grid.innerHTML = list.length
    ? list.map(window.CMSData.cardHtml).join('')
    : '<p class="meta">No projects match that filter.</p>';
}

document.addEventListener('DOMContentLoaded', async () => {
  const grid = document.getElementById('projects-grid');
  try {
    allProjects = await window.CMSData.loadAllProjects();
    renderProjects();
    document.getElementById('sort-year').addEventListener('change', renderProjects);
    document.getElementById('filter-type').addEventListener('change', renderProjects);
  } catch (e) {
    grid.innerHTML = '<p class="meta">Could not load projects right now.</p>';
  }
});
</script>
</body></html>
