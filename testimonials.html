document.addEventListener('DOMContentLoaded', async () => {
  const grid = document.getElementById('testimonials-grid');
  try {

      ? items.map(t => `<div class="card"><blockquote>"${window.CMSData.escapeHtml(t.quote || t.body)}"<cite>- ${window.CMSData.escapeHtml(t.client)}</cite></blockquote></div>`).join('')
